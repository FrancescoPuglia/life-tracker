name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5+ of these actions declare the node24 runtime, silencing the
      # "forced to run on node24" runner warnings emitted by the v4 tags.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Node 20 reached end-of-life in April 2026; 22 is the LTS the
          # project is developed and built on locally.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Add .nojekyll file
        run: touch out/.nojekyll

      - name: Upload artifact
        # v5 wraps upload-artifact v7 (node24); v3 wrapped v4 (node20 warning).
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5